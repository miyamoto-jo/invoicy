<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoicy</title>
  <meta name="description" content="Invoice management system using Google Drive">
  
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; 
                 script-src 'self' 'unsafe-inline' https://accounts.google.com https://www.gstatic.com; 
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
                 font-src 'self' https://fonts.gstatic.com; 
                 img-src 'self' data: https: https://accounts.google.com; 
                 connect-src 'self' https://accounts.google.com https://www.googleapis.com https://oauth2.googleapis.com; 
                 frame-src https://accounts.google.com;">
  
  <!-- PWA manifest -->
  <link rel="manifest" href="/invoicy/manifest.webmanifest">
  
  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Invoicy">
  
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
